<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" fill="none">
  <rect width="1200" height="700" rx="32" fill="#F6F1E9"/>
  <rect x="48" y="56" width="1104" height="94" rx="26" fill="#FFF8EF" stroke="#EADBC8"/>
  <text x="88" y="110" fill="#8C3116" font-family="Arial, sans-serif" font-size="20" font-weight="700">Upload CSV Export</text>
  <text x="88" y="136" fill="#63584D" font-family="Arial, sans-serif" font-size="16">Authenticated users can submit a MyFitnessPal export to the FastAPI backend.</text>
  <rect x="48" y="186" width="720" height="430" rx="30" fill="#FFFDF8" stroke="#E7D2BE"/>
  <rect x="814" y="186" width="338" height="430" rx="30" fill="#FFFDF8" stroke="#E7D2BE"/>
  <rect x="98" y="278" width="620" height="168" rx="26" fill="#FFF7EC" stroke="#DFA879" stroke-dasharray="12 10"/>
  <text x="148" y="340" fill="#1E1B18" font-family="Arial, sans-serif" font-size="22" font-weight="700">Choose MyFitnessPal CSV</text>
  <text x="148" y="378" fill="#63584D" font-family="Arial, sans-serif" font-size="18">Drag in a CSV or pick a file from disk, then send it to /upload.</text>
  <rect x="98" y="490" width="220" height="64" rx="20" fill="#D85C2E"/>
  <text x="140" y="530" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700">Upload and Process</text>
  <text x="852" y="250" fill="#1E1B18" font-family="Arial, sans-serif" font-size="20" font-weight="700">Expected columns</text>
  <text x="852" y="300" fill="#63584D" font-family="Arial, sans-serif" font-size="18">Date</text>
  <text x="852" y="336" fill="#63584D" font-family="Arial, sans-serif" font-size="18">Meal</text>
  <text x="852" y="372" fill="#63584D" font-family="Arial, sans-serif" font-size="18">Food</text>
  <text x="852" y="408" fill="#63584D" font-family="Arial, sans-serif" font-size="18">Calories</text>
  <text x="852" y="444" fill="#63584D" font-family="Arial, sans-serif" font-size="18">Carbs</text>
  <text x="852" y="480" fill="#63584D" font-family="Arial, sans-serif" font-size="18">Protein</text>
  <text x="852" y="516" fill="#63584D" font-family="Arial, sans-serif" font-size="18">Fat</text>
</svg>
